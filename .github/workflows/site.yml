name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install mkdocs mkdocs-material
      - run: python3 site_src/build.py
      - run: mkdocs gh-deploy --force
